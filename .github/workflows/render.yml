name: Render on a CPU runner
# Image-to-video on a free GitHub-hosted runner: 4 vCPU, 16 GB RAM, no GPU.
# LTX-Video 2B 0.9.8 distilled is the only backend with a CPU path (8 fixed steps,
# no CFG). ARCHITECTURE.md said this would not fit; this workflow is the measurement.
# Every phase is timed into <clip>.json, and memory is sampled into <clip>.mem.log,
# so a run that dies still says where.
on:
  workflow_dispatch:
    inputs:
      item:
        description: "Clip id in prompts/motion.json"
        default: "forgemaster-smoke"
        type: choice
        options: [forgemaster-smoke, forgemaster-10s]
      dtype:
        description: "Weights and activations on the CPU"
        default: "float32"
        type: choice
        options: [float32, bfloat16]
      publish:
        description: "Commit the clip to the renders branch"
        default: true
        type: boolean
permissions:
  contents: write
concurrency: {group: render, cancel-in-progress: false}
env:
  HF_HOME: /home/runner/hf
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk, add swap
        # 23.6 GB of weights. The swap is an OOM guard for load-time spikes, not a
        # plan: if the sampler shows it in steady use, the run is mis-sized.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /swap2 && sudo chmod 600 /swap2 && sudo mkswap /swap2 && sudo swapon /swap2
          df -h / ; free -g ; nproc ; lscpu | grep -E 'Model name|Flags' | cut -c1-200
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU stack
        run: |
          python -m pip install --quiet torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet diffusers==0.41.0 transformers accelerate "imageio[ffmpeg]" \
            pillow safetensors sentencepiece protobuf huggingface_hub
          python -m pip freeze | grep -iE '^(torch|diffusers|transformers|accelerate|huggingface)'
      - name: Check
        run: python scripts/forge_motion.py check --device cpu || true
      - name: Render
        env:
          ITEM: ${{ inputs.item }}
          DTYPE: ${{ inputs.dtype }}
        run: |
          mkdir -p out
          ( while true; do echo "$(date +%T) $(free -m | awk '/Mem/{print "used",$3,"avail",$7} /Swap/{print "swap",$3}' | tr '\n' ' ')"; sleep 30; done ) > "out/$ITEM.mem.log" &
          MON=$!
          python scripts/forge_motion.py render --item "$ITEM" --device cpu --dtype "$DTYPE" --out out 2>&1 | tee "out/$ITEM.log"
          rc=${PIPESTATUS[0]}
          kill "$MON" || true
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-${{ inputs.item }}-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit to the renders branch
        if: success() && inputs.publish
        env:
          ITEM: ${{ inputs.item }}
        run: |
          set -e
          cp -r out /tmp/out
          git config user.name "render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin renders || true
          if git ls-remote --exit-code --heads origin renders >/dev/null; then git checkout renders; else git checkout --orphan renders; git rm -rf --quiet . || true; fi
          mkdir -p "renders/$ITEM" && cp /tmp/out/* "renders/$ITEM/"
          git add renders
          (git commit -m "$ITEM from run ${{ github.run_id }}" && git push origin renders) || echo "Nothing new"
