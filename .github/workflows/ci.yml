name: ci
# The parts that need no GPU: spec resolution, the plan, and the refusal path.
# A runner has no CUDA device, which is exactly the condition `check` reports.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --quiet pytest pillow
      - name: Run the suite
        run: python -m pytest tests -q
      - name: The committed example spec must resolve
        run: python scripts/forge_motion.py plan
      - name: check must report no GPU honestly rather than crashing
        run: |
          python scripts/forge_motion.py check && echo "unexpectedly ready" \
            || echo "reported blocked, as expected on a CPU runner"
